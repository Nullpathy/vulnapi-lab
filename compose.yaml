services:
  postgres:
    image: postgres:17
    container_name: vulnapi-postgres
    environment:
      POSTGRES_DB: vulnapi
      POSTGRES_USER: vulnapi
      POSTGRES_PASSWORD: vulnapi_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: