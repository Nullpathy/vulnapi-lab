spring.application.name=vulnapi-lab

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vulnapi}
spring.datasource.username=${DB_USERNAME:vulnapi}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Intentionally weak JWT secret for the vulnerable-lab branch.
security.jwt.secret=${JWT_SECRET:vulnapi-vulnerable-secret-123456}
security.jwt.expiration=3600000
